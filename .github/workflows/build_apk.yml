name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build everything in one step
        run: |
          set -e
          bash setup_project.sh
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          export PATH=/tmp/gradle/gradle-8.11.1/bin:$PATH
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk audiopolka.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiopolka
          path: audiopolka.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: audiopolka v${{ github.run_number }}
          files: audiopolka.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
